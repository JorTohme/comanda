    status: confirmed
    answer: "Tres estados desde ya: libre/ocupada/pedido_en_curso, coincidiendo con sistema-gestion-gastronomico.md §7.8. pedido_en_curso queda sin disparador automático real hasta que exista Pedido (Iter 3); sdd-propose debe documentar esto explícitamente."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma generate

      - run: pnpm turbo run lint

      - run: pnpm turbo run build

      - run: pnpm turbo run test

  api-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comanda
          POSTGRES_PASSWORD: comanda
          POSTGRES_DB: comanda_test
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U comanda -d comanda_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: [56379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://comanda:comanda@localhost:55432/comanda_test?schema=public
      REDIS_URL: redis://localhost:56379
      JWT_SECRET: ci-only-secret-not-for-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:3001
      WEB_APP_URL: http://localhost:3000
      MERCADOPAGO_ACCESS_TOKEN: ci-placeholder
      MERCADOPAGO_WEBHOOK_SECRET: ci-placeholder
      MERCADOPAGO_MERCHANT_ID: "777"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.1.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter @comanda/shared build
      - run: pnpm --filter api exec jest --config jest.integration.config.cjs --runInBand
      - run: pnpm turbo run test lint build
      - run: node apps/api/prisma/seed.mjs
        env:
          NODE_ENV: development
          ALLOW_DEMO_SEED: "true"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

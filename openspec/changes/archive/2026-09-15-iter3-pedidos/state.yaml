change: iter3-pedidos
schema: spec-driven
phases:
  explore:
    status: done
  research:
    status: skipped
  proposal:
    status: done
  specs:
    status: done
  design:
    status: done
  tasks:
    status: done
  apply:
    status: done
    apply_progress:
      - pr: iter3-pedidos-01-backend
        phases_done: [1, 2, 3]
        pr_url: https://github.com/JorTohme/comanda/pull/8
        tracker_pr_url: null
        base_branch: iter3-pedidos
        note: >
          Prisma schema/migration (section 1: enum TipoServicio, enum
          EstadoPedido, model Pedido, model ItemPedido, Restrict FKs on
          Pedido.mesaId and ItemPedido.platoId, back-relation fields on
          Mesa/Plato; additive migration 20260915032236_add_pedidos,
          Categoria/Plato/Mesa columns untouched); the mandatory P2003 fix
          on existing Iter 1/2 files (section 2, RED-first: added failing
          P2003 tests to platos.service.spec.ts and mesas.service.spec.ts
          confirmed failing before the fix, then GREEN — PlatosService.remove
          and MesasService.remove now map Prisma P2003 to ConflictException
          409; also added MesasService.assertMesaExists and
          MesasService.marcarEstado(tx, mesaId, estado) RED-first, and
          exports: [MesasService] on MesasModule); and PedidosService
          (section 3, RED-first: estado-pedido.ts's SIGUIENTE map +
          assertTransicionValida written test-first via a dedicated
          estado-pedido.spec.ts covering all 6 legal transitions + the
          terminal cerrado state; pedidos.service.spec.ts written and
          confirmed failing (module missing) before pedidos.service.ts
          existed, covering price/name snapshot from Plato, tipoServicio/
          mesaId validation in both directions, unknown platoId and unknown
          mesaId rejection, marcarEstado called inside the $transaction
          callback only for tipoServicio=mesa, a full 7x7 table-driven sweep
          of every (actual, destino) EstadoPedido pair for updateEstado (6
          legal, 43 illegal including terminal cerrado and no-ops), the
          Mesa->libre coupling on reaching cerrado, and P2025 -> 404 mapping
          on updateEstado/findOne) all complete and committed on branch
          iter3-pedidos-01-backend off tracker branch iter3-pedidos.
          pnpm --filter api test 104/104 green, pnpm --filter api lint green,
          pnpm --filter api build green. Migration applied against local
          docker-compose Postgres 16. Manual runtime verification (real
          Prisma client against Postgres, not mocks): created a Categoria +
          Plato + Mesa, created a mesa Pedido referencing both via
          PedidosService.create -> confirmed Mesa.estado flipped to
          pedido_en_curso inside the same transaction; then confirmed
          PlatosService.remove(plato.id) and MesasService.remove(mesa.id)
          both throw ConflictException (status 409), not an unhandled 500;
          test rows cleaned up after verification. HTTP controller, DTOs,
          PedidosModule, app.module.ts wiring, packages/shared contracts,
          and the admin UI (sections 4-7) intentionally untouched for PR 2/3
          off this branch, per the review workload forecast's 3-way
          feature-branch-chain split. Deviation: the tracker branch
          iter3-pedidos could not get a draft PR opened yet — its SDD docs
          commit already landed directly on main (unlike Iter 1/2, where
          that commit lived on the tracker branch first), so iter3-pedidos
          is currently byte-identical to main and GitHub rejects an
          empty-diff PR. The tracker PR must be opened once this PR (#8)
          merges into iter3-pedidos and gives it a diff vs main.
      - pr: iter3-pedidos-02-http-shared-ui
        phases_done: [4, 5, 6, 7]
        pr_url: null
        tracker_pr_url: null
        base_branch: iter3-pedidos-01-backend
        note: >
          Landed as commit 09f370e "feat(api,web): Pedidos HTTP layer, shared
          contracts and admin UI": PedidosController (POST/GET/GET:id/PATCH:id/
          estado), hand-written DTOs (no @nestjs/mapped-types), PedidosModule
          wired into AppModule; global ValidationPipe confirmed rejecting
          invalid payloads (empty items, cantidad<1, unknown enum values,
          unknown fields) via curl smoke test. packages/shared gained
          TipoServicio/EstadoPedido types, Pedido/ItemPedido interfaces,
          CreatePedidoInput, SIGUIENTE_ESTADO_PEDIDO, and listPedidos/
          createPedido/avanzarEstadoPedido fetch wrappers. apps/web/app/pedidos
          admin page shipped mirroring salon/catalogo conventions. openspec/
          config.yaml context block refreshed to include the pedidos module.
          pnpm --filter api test 104/104 green at commit time. Deviation from
          the tasks.md-forecast 3-way chain (PR1/PR2/PR3): sections 4-7 landed
          together as a single commit directly on main rather than as two
          separate chained PRs (PR2 targeting PR1's branch, PR3 targeting
          PR2's), continuing the same tracker-PR gap noted in the PR1 entry
          above -- no tracker PR for iter3-pedidos was ever opened, so there
          was no base to chain feature branches against. No functional impact:
          all tasks.md sections 4-7 checkboxes are complete and the shipped
          code matches design.md's HTTP/contract/UI specification.
  verify:
    status: done
    verdict: pass
    verify_report_path: openspec/changes/iter3-pedidos/verify-report.md
    summary: >
      Bookkeeping-close-out verify (2026-09-15), lighter than iter2's
      independent-re-verification pass per explicit task scope: fresh
      pnpm --filter api test run (107/107 passing, includes estado-pedido,
      pedidos.service, mesas.service, platos.service, categorias.service,
      and auth/jwt suites -- no regressions) and fresh pnpm --filter web
      build (succeeds, /pedidos route compiles statically at 3.63 kB).
      Source inspection of apps/api/src/pedidos/pedidos.service.ts against
      design.md's Architecture Decisions confirms no drift: transition
      guard via estado-pedido.ts's SIGUIENTE map, interactive
      $transaction wrapping the Pedido/ItemPedido write and the
      MesasService.marcarEstado call, tipoServicio/mesaId cross-checks,
      Plato snapshot into ItemPedido, cerrado -> libre coupling. The only
      difference from design.md's sketched signature is an added `tenant:
      TenantContext` parameter threaded through every method, which comes
      from the separate, later, out-of-scope tenant-isolation work
      (commit 4b8268f) and is not a regression or a deviation of this
      change. No live curl/browser re-verification was performed in this
      pass (already covered by the apply-phase notes and tasks.md 7.4/7.5);
      see verify-report.md for full detail and the resulting warning.
  archive:
    status: done
open_decisions:
  - id: research
    question: "¿Corremos sdd-research antes de la propuesta?"
    status: confirmed
    answer: "Saltear — decisiones internas de modelado, sin necesidad de evidencia externa."
  - id: ui-pedidos
    question: "¿Qué interfaz construimos para \"carga desde mozo\" esta iteración?"
    status: confirmed
    answer: "Admin screen en apps/web (/pedidos), mismo patrón que /catalogo y /salon. apps/operativa queda sin tocar hasta Iter 5 (offline-first)."
  - id: acople-mesa
    question: "¿Abrir/cerrar un Pedido mueve el estado de la Mesa automáticamente?"
    status: confirmed
    answer: "Sí, acoplar ahora: PedidosService llama a MesasService — abrir un pedido tipo_servicio=mesa pasa Mesa.estado a pedido_en_curso, un estado terminal (cerrado) la vuelve a libre. Primer acople cross-módulo del repo; documentar explícitamente en design.md."
  - id: precio-item
    question: "¿ItemPedido snapshotea el precio o lee Plato.precio en vivo?"
    status: confirmed
    answer: "Snapshot: precioUnitario (y nombre) se copian a ItemPedido al crear el pedido, mismo manejo de centavos que Plato.precio."
  - id: tipo-servicio-enum
    question: "¿El enum tipo_servicio incluye takeaway/delivery ya, o solo mesa/barra?"
    status: confirmed
    answer: "Solo mesa/barra por ahora (YAGNI) — a diferencia de Mesa.pedido_en_curso, no hay ninguna función que necesite construir takeaway/delivery esta iteración; se agregan cuando Fase 2 los implemente."
next_recommended: null

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma generate

      - run: pnpm turbo run lint

      - run: pnpm turbo run build

      - run: pnpm turbo run test

  api-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comanda
          POSTGRES_PASSWORD: comanda
          POSTGRES_DB: comanda
        ports: [5432:5432]
      redis:
        image: redis:7
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql://comanda:comanda@localhost:5432/comanda?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-for-production
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3001
      WEB_APP_URL: http://localhost:3000
      MERCADOPAGO_ACCESS_TOKEN: ci-placeholder
      MERCADOPAGO_WEBHOOK_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.1.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api test -- --runInBand
